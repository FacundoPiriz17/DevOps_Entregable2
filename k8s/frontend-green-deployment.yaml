apiVersion: apps/v1
kind: Deployment
metadata:
  name: playhub-frontend-green
  labels:
    app: playhub-frontend
    slot: green
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 360
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playhub-frontend
      slot: green
  template:
    metadata:
      labels:
        app: playhub-frontend
        slot: green
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: playhub-frontend:v2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5745
          env:
            - name: PORT
              value: "5745"
            - name: HOSTNAME
              value: "0.0.0.0"
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
