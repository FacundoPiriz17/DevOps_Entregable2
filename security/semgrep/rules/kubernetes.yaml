{"rules":[{"id":"yaml.kubernetes.security.allow-privilege-escalation.allow-privilege-escalation","patterns":[{"pattern-inside":"containers:\n  ...\n"},{"pattern-inside":"- name: $CONTAINER\n  ...\n"},{"pattern":"image: ...\n...\n"},{"pattern-inside":"image: ...\n...\n$SC:\n  ...\n"},{"metavariable-regex":{"metavariable":"$SC","regex":"^(securityContext)$"}},{"pattern-not-inside":"image: ...\n...\nsecurityContext:\n  ...\n  allowPrivilegeEscalation: $VAL\n"},{"focus-metavariable":"$SC"}],"fix":"securityContext:\n  allowPrivilegeEscalation: false #\n","message":"In Kubernetes, each pod runs in its own isolated environment with its own set of security policies. However, certain container images may contain `setuid` or `setgid` binaries that could allow an attacker to perform privilege escalation and gain access to sensitive resources. To mitigate this risk, it's recommended to add a `securityContext` to the container in the pod, with the parameter `allowPrivilegeEscalation` set to `false`. This will prevent the container from running any privileged processes and limit the impact of any potential attacks. By adding the `allowPrivilegeEscalation` parameter to your the `securityContext`, you can help to ensure that your containerized applications are more secure and less vulnerable to privilege escalation attacks.","metadata":{"cwe":["CWE-732: Incorrect Permission Assignment for Critical Resource"],"owasp":["A05:2021 - Security Misconfiguration","A06:2017 - Security Misconfiguration","A02:2025 - Security Misconfiguration"],"references":["https://kubernetes.io/docs/concepts/policy/pod-security-policy/#privilege-escalation","https://kubernetes.io/docs/tasks/configure-pod-container/security-context/","https://www.kernel.org/doc/Documentation/prctl/no_new_privs.txt","https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-4-add-no-new-privileges-flag"],"category":"security","technology":["kubernetes"],"cwe2021-top25":true,"subcategory":["vuln"],"likelihood":"MEDIUM","impact":"MEDIUM","confidence":"MEDIUM","license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Improper Authorization"],"source":"https://semgrep.dev/r/yaml.kubernetes.security.allow-privilege-escalation.allow-privilege-escalation","shortlink":"https://sg.run/ljp6","semgrep.dev":{"rule":{"r_id":10057,"rv_id":1263933,"rule_id":"6JUqEO","version_id":"jQTn527","url":"https://semgrep.dev/playground/r/jQTn527/yaml.kubernetes.security.allow-privilege-escalation.allow-privilege-escalation","origin":"community","path":"yaml.kubernetes.security.allow-privilege-escalation.allow-privilege-escalation"}}},"languages":["yaml"],"severity":"WARNING"},{"id":"yaml.kubernetes.security.exposing-docker-socket-hostpath.exposing-docker-socket-hostpath","patterns":[{"pattern-inside":"volumes:\n  ...\n"},{"pattern":"hostPath:\n  ...\n  path: /var/run/docker.sock\n"}],"message":"Exposing host's Docker socket to containers via a volume. The owner of this socket is root. Giving someone access to it is equivalent to giving unrestricted root access to your host. Remove 'docker.sock' from hostpath to prevent this.","metadata":{"cwe":["CWE-250: Execution with Unnecessary Privileges"],"references":["https://kubernetes.io/docs/concepts/storage/volumes/#hostpath","https://kubernetes.io/docs/concepts/policy/pod-security-policy/#volumes-and-file-systems","https://kubernetes.io/docs/tasks/configure-pod-container/security-context/","https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-1-do-not-expose-the-docker-daemon-socket-even-to-the-containers"],"category":"security","technology":["kubernetes"],"subcategory":["vuln"],"likelihood":"LOW","impact":"HIGH","confidence":"MEDIUM","license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Improper Authorization"],"source":"https://semgrep.dev/r/yaml.kubernetes.security.exposing-docker-socket-hostpath.exposing-docker-socket-hostpath","shortlink":"https://sg.run/v0pR","semgrep.dev":{"rule":{"r_id":10133,"rv_id":947054,"rule_id":"d8Uz6v","version_id":"nWTpYZe","url":"https://semgrep.dev/playground/r/nWTpYZe/yaml.kubernetes.security.exposing-docker-socket-hostpath.exposing-docker-socket-hostpath","origin":"community","path":"yaml.kubernetes.security.exposing-docker-socket-hostpath.exposing-docker-socket-hostpath"}}},"languages":["yaml"],"severity":"WARNING"},{"id":"yaml.kubernetes.security.privileged-container.privileged-container","pattern-either":[{"patterns":[{"pattern-inside":"containers:\n  ...\n"},{"pattern-inside":"image: ...\n...\nsecurityContext:\n  ...\n"},{"pattern":"privileged: true\n"}]},{"patterns":[{"pattern-inside":"spec:\n  ...\n"},{"pattern-not-inside":"image: ...\n...\n"},{"pattern":"privileged: true\n"}]}],"message":"Container or pod is running in privileged mode. This grants the container the equivalent of root capabilities on the host machine. This can lead to container escapes, privilege escalation, and other security concerns. Remove the 'privileged' key to disable this capability.","metadata":{"cwe":["CWE-250: Execution with Unnecessary Privileges"],"references":["https://kubernetes.io/docs/concepts/policy/pod-security-policy/#privileged","https://kubernetes.io/docs/tasks/configure-pod-container/security-context/","https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"],"category":"security","technology":["kubernetes"],"subcategory":["vuln"],"likelihood":"MEDIUM","impact":"MEDIUM","confidence":"MEDIUM","license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Improper Authorization"],"source":"https://semgrep.dev/r/yaml.kubernetes.security.privileged-container.privileged-container","shortlink":"https://sg.run/Ygr5","semgrep.dev":{"rule":{"r_id":10058,"rv_id":1501845,"rule_id":"oqUz2p","version_id":"d6T70JW","url":"https://semgrep.dev/playground/r/d6T70JW/yaml.kubernetes.security.privileged-container.privileged-container","origin":"community","path":"yaml.kubernetes.security.privileged-container.privileged-container"}}},"languages":["yaml"],"severity":"WARNING"},{"id":"yaml.kubernetes.security.run-as-non-root.run-as-non-root","patterns":[{"pattern-inside":"$SPEC:\n  ...\n  containers:\n    ...\n  ...\n"},{"metavariable-regex":{"metavariable":"$SPEC","regex":"^(spec)$"}},{"pattern-not-inside":"spec:\n  ...\n  securityContext:\n    ...\n  ...\n"},{"pattern-inside":"$SPEC:\n  ...\n  containers:\n    ...\n"},{"pattern-not-inside":"$SPEC:\n  ...\n  containers:\n    ...\n    - name: $NAME\n      image: ...\n      ...\n      securityContext:\n        ...\n        runAsNonRoot: $VALUE\n"},{"focus-metavariable":"$SPEC"}],"fix":"$SPEC:\n  securityContext:\n    runAsNonRoot: true #\n","message":"When running containers in Kubernetes, it's important to ensure that they  are properly secured to prevent privilege escalation attacks.  One potential vulnerability is when a container is allowed to run  applications as the root user, which could allow an attacker to gain  access to sensitive resources. To mitigate this risk, it's recommended to  add a `securityContext` to the container, with the parameter `runAsNonRoot`  set to `true`. This will ensure that the container runs as a non-root user,  limiting the damage that could be caused by any potential attacks. By  adding a `securityContext` to the container in your Kubernetes pod, you can  help to ensure that your containerized applications are more secure and  less vulnerable to privilege escalation attacks.","metadata":{"references":["https://kubernetes.io/blog/2016/08/security-best-practices-kubernetes-deployment/","https://kubernetes.io/docs/concepts/policy/pod-security-policy/","https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-2-set-a-user"],"category":"security","cwe":["CWE-250: Execution with Unnecessary Privileges"],"owas