{{- if not .Values.secrets.existingSecret }}
{{- if and .Values.secrets.jwtSecret (lt (len .Values.secrets.jwtSecret) 48) }}
{{- fail "secrets.jwtSecret requiere al menos 48 bytes UTF-8 para HS384" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "playhub.fullname" . }}-secrets
  labels:
    {{- include "playhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "Falta secrets.dbPassword (usar --set secrets.dbPassword=... o secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ required "Falta secrets.jwtSecret, de al menos 48 bytes UTF-8 (usar --set secrets.jwtSecret=...)" .Values.secrets.jwtSecret | quote }}
  ADMIN_PASSWORD: {{ required "Falta secrets.adminPassword (usar --set secrets.adminPassword=...)" .Values.secrets.adminPassword | quote }}
{{- end }}
