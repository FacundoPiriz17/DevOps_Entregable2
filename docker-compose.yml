name: playhub-dev

services:
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/devops_db
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      COOKIE_SECURE: "false"

    depends_on:
      db:
        condition: service_healthy

    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src

        - action: rebuild
          path: ./backend/pom.xml

  frontend:
    build: ./frontend

    ports:
      - "6996:9669"

    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json

        - action: rebuild
          path: ./frontend/package.json

        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  postgres_data: