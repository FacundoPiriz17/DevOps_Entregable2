backend:
  replicaCount: 1
  image:
    tag: v1.0
    pullPolicy: Never
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

frontend:
  replicaCount: 1
  image:
    tag: v1.0
    pullPolicy: Never
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  persistence:
    enabled: true
    size: 1Gi

config:
  corsAllowedOrigins: "http://localhost:5745"
  cookieSecure: "false"

ingress:
  enabled: false
