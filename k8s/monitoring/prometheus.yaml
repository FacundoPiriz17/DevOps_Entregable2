apiVersion: v1
kind: ConfigMap
metadata:
  name: playhub-prometheus-config
  labels:
    app: playhub-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: playhub-node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: playhub-kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep

      # El kubelet con cri-dockerd puede omitir totalmente la red de los pods.
      - job_name: cadvisor-network
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: playhub-cadvisor-network
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_network_(receive|transmit)_bytes_total
            action: keep
          - source_labels: [container_label_io_kubernetes_pod_namespace]
            regex: (.+)
            target_label: namespace
          - source_labels: [container_label_io_kubernetes_pod_name]
            regex: (.+)
            target_label: pod
          - source_labels: [container_label_io_kubernetes_container_name]
            regex: (.+)
            target_label: container
          - regex: container_label_.*
            action: labeldrop

      # El API server valida TLS y autentica el acceso a cada kubelet.
      - job_name: kubelet-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      # Incluye volumenes persistentes cuando el driver publica estas metricas.
      - job_name: kubelet
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      # CPU/RAM con etiquetas Kubernetes incluso en Minikube con cri-dockerd.
      - job_name: kubelet-resource
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/resource
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      # Descubre todos los pods de backend (Blue y Green) y agrega el label
      # slot para poder comparar el trafico entre slots en Grafana.
      - job_name: playhub-backend
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: playhub-backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_slot]
            target_label: slot
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: playhub-prometheus-data
  labels:
    app: playhub-prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playhub-prometheus
  labels:
    app: playhub-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playhub-prometheus
  template:
    metadata:
      labels:
        app: playhub-prometheus
    spec:
      serviceAccountName: playhub-prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: playhub-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: playhub-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: playhub-prometheus
  labels:
    app: playhub-prometheus
spec:
  type: ClusterIP
  selector:
    app: playhub-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
