
apiVersion: batch/v1
kind: Job
metadata:
  name: playhub-migrations-repair
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: flyway
          image: redgate/flyway:13.4
          securityContext:
            allowPrivilegeEscalation: false
          args: ["repair"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: FLYWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: playhub-config
                  key: DB_URL
            - name: FLYWAY_USER
              valueFrom:
                configMapKeyRef:
                  name: playhub-config
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: playhub-secrets
                  key: DB_PASSWORD
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: FLYWAY_VALIDATE_MIGRATION_NAMING
              value: "true"
          volumeMounts:
            - name: migration-sql
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: migration-sql
          configMap:
            name: playhub-migration-sql
