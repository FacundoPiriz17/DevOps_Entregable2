m: true' to this container to prevent this.","metadata":{"cwe":["CWE-732: Incorrect Permission Assignment for Critical Resource"],"owasp":["A05:2021 - Security Misconfiguration","A06:2017 - Security Misconfiguration","A02:2025 - Security Misconfiguration"],"references":["https://kubernetes.io/docs/concepts/policy/pod-security-policy/#volumes-and-file-systems","https://kubernetes.io/docs/tasks/configure-pod-container/security-context/","https://blog.atomist.com/security-of-docker-kubernetes/","https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-8-set-filesystem-and-volumes-to-read-only"],"category":"security","technology":["kubernetes"],"cwe2021-top25":true,"subcategory":["audit"],"likelihood":"LOW","impact":"MEDIUM","confidence":"LOW","license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Improper Authorization"],"source":"https://semgrep.dev/r/yaml.kubernetes.security.writable-filesystem-container.writable-filesystem-container","shortlink":"https://sg.run/ZePL","semgrep.dev":{"rule":{"r_id":10135,"rv_id":1263945,"rule_id":"nJUYn9","version_id":"vdT06PY","url":"https://semgrep.dev/playground/r/vdT06PY/yaml.kubernetes.security.writable-filesystem-container.writable-filesystem-container","origin":"community","path":"yaml.kubernetes.security.writable-filesystem-container.writable-filesystem-container"}}},"languages":["yaml"],"severity":"WARNING"},{"id":"yaml.kubernetes.security.hostipc-pod.hostipc-pod","patterns":[{"pattern-inside":"spec:\n  ...\n"},{"pattern":"hostIPC: true\n"}],"message":"Pod is sharing the host IPC namespace. This allows container processes to communicate with processes on the host which reduces isolation and bypasses container protection models. Remove the 'hostIPC' key to disable this functionality.","metadata":{"cwe":["CWE-693: Protection Mechanism Failure"],"references":["https://kubernetes.io/docs/concepts/policy/pod-security-policy/#host-namespaces"],"category":"security","technology":["kubernetes"],"subcategory":["audit"],"likelihood":"LOW","impact":"MEDIUM","confidence":"LOW","license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Improper Authorization"],"source":"https://semgrep.dev/r/yaml.kubernetes.security.hostipc-pod.hostipc-pod","shortlink":"https://sg.run/nqGO","semgrep.dev":{"rule":{"r_id":10236,"rv_id":947055,"rule_id":"nJUYPE","version_id":"ExTg4KB","url":"https://semgrep.dev/playground/r/ExTg4KB/yaml.kubernetes.security.hostipc-pod.hostipc-pod","origin":"community","path":"yaml.kubernetes.security.hostipc-pod.hostipc-pod"}}},"languages":["yaml"],"severity":"WARNING"},{"id":"yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod","patterns":[{"pattern-inside":"spec:\n  ...\n"},{"pattern":"hostNetwork: true\n"}],"message":"Pod may use the node network namespace. This gives the pod access to the loopback device, services listening on localhost, and could be used to snoop on network activity of other pods on the same node. Remove the 'hostNetwork' key to disable this functionality.","metadata":{"cwe":["CWE-406: Insufficient Control of Network Message Volume (Network Amplification)"],"references":["https://kubernetes.io/docs/concepts/policy/pod-security-policy/#host-namespaces"],"category":"security","technology":["kubernetes"],"subcategory":["audit"],"likelihood":"LOW","impact":"MEDIUM","confidence":"LOW","license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Other"],"source":"https://semgrep.dev/r/yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod","shortlink":"https://sg.run/E51A","semgrep.dev":{"rule":{"r_id":10237,"rv_id":947056,"rule_id":"EwU4NO","version_id":"7ZTreWz","url":"https://semgrep.dev/playground/r/7ZTreWz/yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod","origin":"community","path":"yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod"}