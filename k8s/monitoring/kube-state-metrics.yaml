apiVersion: v1
kind: ServiceAccount
metadata:
  name: playhub-kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playhub-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playhub-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playhub-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: playhub-kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playhub-kube-state-metrics
  labels:
    app: playhub-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playhub-kube-state-metrics
  template:
    metadata:
      labels:
        app: playhub-kube-state-metrics
    spec:
      serviceAccountName: playhub-kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args:
            - --resources=pods
            - --namespaces=$(POD_NAMESPACE)
            - --metric-allowlist=kube_pod_info,kube_pod_container_info,kube_pod_container_resource_limits,kube_pod_container_resource_requests
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
