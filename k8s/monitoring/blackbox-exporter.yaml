apiVersion: v1
kind: ConfigMap
metadata:
  name: playhub-blackbox-config
  labels:
    app: playhub-blackbox-exporter
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
          follow_redirects: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playhub-blackbox-exporter
  labels:
    app: playhub-blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playhub-blackbox-exporter
  template:
    metadata:
      labels:
        app: playhub-blackbox-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.29.0
          imagePullPolicy: IfNotPresent
          args: [--config.file=/etc/blackbox/blackbox.yml]
          ports:
            - name: http
              containerPort: 9115
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: playhub-blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: playhub-blackbox-exporter
  labels:
    app: playhub-blackbox-exporter
spec:
  selector:
    app: playhub-blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
