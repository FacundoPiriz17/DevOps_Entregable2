{{- if .Values.monitoring.enabled }}
{{- $base := include "playhub.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $base }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "playhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: playhub-prometheus
        type: prometheus
        access: proxy
        url: http://{{ $base }}-prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $base }}-grafana-dashboard-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "playhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
data:
  resources.yaml: |
    apiVersion: 1
    providers:
      - name: playhub-resources
        orgId: 1
        folder: PlayHub
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $base }}-grafana-resource-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "playhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
data:
  {{- range $path, $_ := .Files.Glob "files/grafana/dashboards/*.json" }}
  {{ base $path }}: |
    {{- include "playhub.monitoring.adaptQueries" (dict "root" $ "content" ($.Files.Get $path)) | nindent 4 }}
  {{- end }}
{{- end }}
