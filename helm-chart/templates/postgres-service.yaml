apiVersion: v1
kind: Service
metadata:
  name: {{ include "playhub.fullname" . }}-db
  labels:
    {{- include "playhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "playhub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
