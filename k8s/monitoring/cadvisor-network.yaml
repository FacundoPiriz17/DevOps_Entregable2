apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: playhub-cadvisor-network
  labels:
    app: playhub-cadvisor-network
spec:
  selector:
    matchLabels:
      app: playhub-cadvisor-network
  template:
    metadata:
      labels:
        app: playhub-cadvisor-network
    spec:
      automountServiceAccountToken: false
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:0.60.6
          args:
            - --enable_metrics=network
            - --housekeeping_interval=15s
            - --storage_duration=1m
            - --store_container_labels=false
            - --whitelisted_container_labels=io.kubernetes.pod.namespace,io.kubernetes.pod.name,io.kubernetes.container.name
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Necesita acceder a los namespaces de red y al runtime del nodo.
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: runtime
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: runtime-data
              mountPath: /var/lib
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: runtime
          hostPath:
            path: /var/run
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: runtime-data
          hostPath:
            path: /var/lib
            type: Directory
