apiVersion: v1
kind: Pod
metadata:
  name: kyverno-valid
  namespace: kyverno-validation
  labels:
    app: kyverno-validation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: demo
      image: busybox:1.37.0
      command: ["sh", "-c", "id; sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
