apiVersion: apps/v1
kind: Deployment
metadata:
  name: playhub-backend-green
  labels:
    app: playhub-backend
    slot: green
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 360
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playhub-backend
      slot: green
  template:
    metadata:
      labels:
        app: playhub-backend
        slot: green
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: playhub-backend:v2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: playhub-config
            - secretRef:
                name: playhub-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
