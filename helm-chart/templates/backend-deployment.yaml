apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "playhub.fullname" . }}-backend
  labels:
    {{- include "playhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 360
  selector:
    matchLabels:
      {{- include "playhub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "playhub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        app: {{ include "playhub.fullname" . }}-backend
        slot: {{ .Values.backend.slot | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        playhub.io/release-revision: {{ .Release.Revision | quote }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: flyway-migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args:
            - migrate
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: FLYWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "playhub.fullname" . }}-config
                  key: DB_URL
            - name: FLYWAY_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "playhub.fullname" . }}-config
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "playhub.secretName" . }}
                  key: DB_PASSWORD
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: FLYWAY_CONNECT_RETRIES
              value: "60"
            - name: FLYWAY_VALIDATE_MIGRATION_NAMING
              value: "true"
          volumeMounts:
            - name: migration-sql
              mountPath: /flyway/sql
              readOnly: true
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "playhub.fullname" . }}-config
            - secretRef:
                name: {{ include "playhub.secretName" . }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.backend.containerPort | quote }}
            - name: MANAGEMENT_METRICS_TAGS_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MANAGEMENT_METRICS_TAGS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- if .Values.migrations.enabled }}
      volumes:
        - name: migration-sql
          configMap:
            name: {{ include "playhub.fullname" . }}-migration-sql
      {{- end }}
