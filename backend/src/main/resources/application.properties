spring.application.name=devops_backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devops_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120

app.cookie.secure=${COOKIE_SECURE:true}

admin.bootstrap.email=${ADMIN_EMAIL}
admin.bootstrap.password=${ADMIN_PASSWORD}
admin.bootstrap.country=Uruguay

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
