apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: playhub-grafana-data
  labels:
    app: playhub-grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playhub-grafana
  labels:
    app: playhub-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playhub-grafana
  template:
    metadata:
      labels:
        app: playhub-grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: playhub-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: playhub-grafana
  labels:
    app: playhub-grafana
spec:
  type: ClusterIP
  selector:
    app: playhub-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
